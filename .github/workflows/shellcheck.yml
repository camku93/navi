name: shellcheck

on: [push, pull_request]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts
        run: |
          files=$(git ls-files -- ':!src' | while read -r f; do
            head -n1 "$f" | grep -qE '^#!.*\b(ba|da)?sh\b' && echo "$f"
          done)
          shellcheck lib/navi-files.sh $files
